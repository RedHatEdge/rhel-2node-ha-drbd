<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="940" height="330" viewBox="0 0 940 330" role="img" aria-label="With single-primary DRBD the filesystem is mounted on one node at a time, so the migration target cannot open the guest disk and libvirt refuses. With shared storage both hosts have the disk open and live migration succeeds."><rect width="940" height="330" fill="#ffffff"/>
    <defs>
      <marker id="ar2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="context-stroke"/>
      </marker>
    </defs>

    <text x="20" y="26" font-family="var(--display)" font-size="14" fill="#a30000">Option B &#183; DRBD single-primary</text>
    <rect x="20" y="40" width="190" height="120" rx="3" fill="#ffffff" stroke="#d2d2d2"/>
    <text x="36" y="64" font-family="var(--mono)" font-size="12" fill="#151515">node1</text>
    <rect x="36" y="76" width="158" height="34" rx="3" fill="#fafafa" stroke="#0066cc"/>
    <text x="46" y="98" font-family="var(--mono)" font-size="11" fill="#004b95">/var/store-a MOUNTED</text>
    <text x="36" y="132" font-family="var(--mono)" font-size="11" fill="#4d4d4d">guest disk open here</text>
    <text x="36" y="150" font-family="var(--mono)" font-size="11" fill="#6a6e73">DRBD Primary</text>

    <rect x="250" y="40" width="190" height="120" rx="3" fill="#ffffff" stroke="#d2d2d2"/>
    <text x="266" y="64" font-family="var(--mono)" font-size="12" fill="#151515">node2</text>
    <rect x="266" y="76" width="158" height="34" rx="3" fill="#f0f0f0" stroke="#d2d2d2" stroke-dasharray="4 3"/>
    <text x="276" y="98" font-family="var(--mono)" font-size="11" fill="#6a6e73">not mounted</text>
    <text x="266" y="132" font-family="var(--mono)" font-size="11" fill="#6a6e73">cannot open the disk</text>
    <text x="266" y="150" font-family="var(--mono)" font-size="11" fill="#6a6e73">DRBD Secondary</text>

    <path d="M212 100 L248 100" stroke="#ee0000" stroke-width="2" marker-end="url(#ar2)" fill="none"/>
    <path d="M218 92 L242 108 M242 92 L218 108" stroke="#ee0000" stroke-width="2.2" fill="none"/>

    <text x="20" y="196" font-family="var(--mono)" font-size="12" fill="#a30000">error: Unsafe migration: Migration without shared storage is unsafe</text>
    <text x="20" y="218" font-family="var(--mono)" font-size="11.5" fill="#4d4d4d">Pacemaker falls back to stop-and-start &#8212; the guest RESTARTS to move.</text>
    <text x="20" y="238" font-family="var(--mono)" font-size="11.5" fill="#4d4d4d">Measured cost of a planned move: about 12 seconds of guest downtime.</text>

    <line x1="470" y1="30" x2="470" y2="300" stroke="#d2d2d2" stroke-width="1"/>

    <text x="500" y="26" font-family="var(--display)" font-size="14" fill="#004b95">Option A &#183; shared LUN, for contrast</text>
    <rect x="500" y="40" width="190" height="120" rx="3" fill="#ffffff" stroke="#d2d2d2"/>
    <text x="516" y="64" font-family="var(--mono)" font-size="12" fill="#151515">node1</text>
    <rect x="516" y="76" width="158" height="34" rx="3" fill="#fafafa" stroke="#0066cc"/>
    <text x="526" y="98" font-family="var(--mono)" font-size="11" fill="#004b95">LUN open</text>
    <text x="516" y="132" font-family="var(--mono)" font-size="11" fill="#4d4d4d">guest running</text>

    <rect x="730" y="40" width="190" height="120" rx="3" fill="#ffffff" stroke="#d2d2d2"/>
    <text x="746" y="64" font-family="var(--mono)" font-size="12" fill="#151515">node2</text>
    <rect x="746" y="76" width="158" height="34" rx="3" fill="#fafafa" stroke="#0066cc"/>
    <text x="756" y="98" font-family="var(--mono)" font-size="11" fill="#004b95">SAME LUN open</text>
    <text x="746" y="132" font-family="var(--mono)" font-size="11" fill="#4d4d4d">ready to receive</text>

    <path d="M692 100 L728 100" stroke="#0066cc" stroke-width="2" marker-end="url(#ar2)" fill="none"/>

    <text x="500" y="196" font-family="var(--mono)" font-size="12" fill="#004b95">live migration succeeds &#8212; the guest never restarts</text>
    <text x="500" y="218" font-family="var(--mono)" font-size="11.5" fill="#4d4d4d">Both hosts have the disk open at the same time, which is what</text>
    <text x="500" y="238" font-family="var(--mono)" font-size="11.5" fill="#4d4d4d">live migration requires. Measured: about 1.2 seconds.</text>

    <text x="20" y="286" font-family="var(--mono)" font-size="11.5" fill="#6a6e73">Live migration on DRBD would need dual-primary plus a cluster filesystem (GFS2), adding DLM and lvmlockd to every node</text>
    <text x="20" y="306" font-family="var(--mono)" font-size="11.5" fill="#6a6e73">and making fencing correctness load-bearing rather than merely important. A materially heavier design.</text>
  </svg>
